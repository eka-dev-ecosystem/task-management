name: Deploy Android (Jetpack Compose) - [MANUAL ONLY]

# =========================================================================
# PENTING: Workflow ini TIDAK berjalan otomatis pada push atau PR.
# Hanya dapat di-trigger secara manual (workflow_dispatch) via tab GitHub Actions
# untuk menghasilkan APK Release (siap didownload & dipublikasikan di web portofolio)
# atau opsional diunggah ke Google Play Console jika diinginkan.
# =========================================================================
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipe build Android (apk untuk distribusi web langsung, bundle, atau both)'
        required: false
        default: 'apk'
        type: choice
        options:
          - apk
          - bundle
          - both
      upload_to_play_store:
        description: 'Upload otomatis ke Google Play Console (Biarkan false untuk distribusi mandiri/web portofolio)'
        type: boolean
        default: false
      track:
        description: 'Google Play Store Track (Hanya jika upload_to_play_store diaktifkan)'
        required: false
        default: 'internal'

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  deploy-android:
    name: Build & Deploy Android (Manual)
    concurrency:
      group: release-pipeline-${{ github.repository }}
      cancel-in-progress: false
    uses: exa31/github-workflows/.github/workflows/compose-android.yml@v1.0.0
    with:
      app_name: task-hub-android
      java_version: "17"
      module_name: app
      package_name: cloud.eka_dev.task_hub
      build_type: ${{ inputs.build_type || 'apk' }}
      track: ${{ inputs.track || 'internal' }}
      upload_to_play_store: ${{ inputs.upload_to_play_store || false }}
      tag_prefix: "android-"
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
