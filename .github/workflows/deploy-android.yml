name: Deploy Android (Jetpack Compose)

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/deploy-android.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/deploy-android.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipe build Android (apk untuk distribusi web langsung, bundle, atau both)'
        required: false
        default: 'apk'
        type: choice
        options:
          - apk
          - bundle
          - both
      upload_to_play_store:
        description: 'Upload otomatis ke Google Play Console (Biarkan false untuk distribusi mandiri/web portofolio)'
        type: boolean
        default: false
      track:
        description: 'Google Play Store Track (Hanya jika upload_to_play_store diaktifkan)'
        required: false
        default: 'internal'

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

concurrency:
  group: release-pipeline-android-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # ==========================================
  # 1. CI Quality Gate & Release APK Build
  # ==========================================
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Setup Environment (.env)
        env:
          SECRET_ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$SECRET_ENV_FILE" ]; then
            echo "📄 Menulis .env dari GitHub Secrets ENV_FILE..."
            echo "$SECRET_ENV_FILE" > .env
          elif [ -f .env.example ]; then
            echo "📄 Menyalin .env dari .env.example..."
            cp .env.example .env
          else
            echo "📄 Membuat placeholder .env..."
            touch .env
          fi

      - name: Setup Keystore & Signing Config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'TaskHubSecureRelease2026!' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'taskhub' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'TaskHubSecureRelease2026!' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "🔑 Mendecode keystore dari GitHub Secrets ANDROID_KEYSTORE_BASE64..."
            echo "$KEYSTORE_BASE64" | base64 --decode > taskhub-release.jks
          fi
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: task-hub-android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            TAG="android-v1.0.${{ github.run_number }}"
            echo "🏷️ Membuat GitHub Release tag: $TAG..."
            gh release create "$TAG" "$APK_FILE" \
              --title "Task Hub Android v1.0.${{ github.run_number }}" \
              --notes "Android Release APK siap unduh untuk web portofolio. Build run: ${{ github.run_number }}." \
              --generate-notes || gh release upload "$TAG" "$APK_FILE" --clobber || echo "⚠️ Upload release dilewati atau sudah ada."
          fi

  # ==========================================
  # 2. CD Deployment: Google Play Store (Opsional)
  # ==========================================
  deploy-playstore:
    name: Deploy to Google Play Console
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.upload_to_play_store == true
    uses: exa31/github-workflows/.github/workflows/compose-android.yml@v1.0.0
    with:
      app_name: task-hub-android
      java_version: "17"
      module_name: app
      package_name: cloud.eka_dev.task_hub
      build_type: ${{ inputs.build_type || 'apk' }}
      track: ${{ inputs.track || 'internal' }}
      upload_to_play_store: true
      tag_prefix: "android-"
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
